<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{% url 'poll_list' %}">Kararsızım</a>
    <nav class="header-nav" aria-label="Ana menü">
      <a class="btn btn-primary" href="{% url 'poll_create' %}">Anket oluştur</a>
      {% if user.is_authenticated %}
        <a class="header-user" href="{% url 'user_polls' user.username %}">@{{ user.username }}</a>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-link">Çıkış</button>
        </form>
      {% else %}
        <a class="btn btn-link" href="{% url 'login' %}">Giriş yap</a>
        <a class="btn btn-link" href="{% url 'signup' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
