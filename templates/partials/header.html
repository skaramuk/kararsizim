<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{% url 'home' %}">Kararsızım</a>
    <nav class="header-nav" aria-label="Ana menü">
      {# Faz 2: "Anket oluştur" butonu ve @kullanıcı_adı sayfa bağlantısı eklenecek. #}
      {% if user.is_authenticated %}
        <span class="header-user">@{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="inline-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-link">Çıkış</button>
        </form>
      {% else %}
        <a class="btn btn-link" href="{% url 'login' %}">Giriş yap</a>
        <a class="btn btn-primary" href="{% url 'signup' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
