{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Sayfalar">
  {% if page_obj.has_previous %}
    <a class="btn btn-link" href="?page={{ page_obj.previous_page_number }}{% if sort == 'populer' %}&amp;sirala=populer{% endif %}" rel="prev">&larr; Önceki</a>
  {% else %}
    <span class="pagination-disabled">&larr; Önceki</span>
  {% endif %}
  <span class="pagination-info">Sayfa {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-link" href="?page={{ page_obj.next_page_number }}{% if sort == 'populer' %}&amp;sirala=populer{% endif %}" rel="next">Sonraki &rarr;</a>
  {% else %}
    <span class="pagination-disabled">Sonraki &rarr;</span>
  {% endif %}
</nav>
{% endif %}
